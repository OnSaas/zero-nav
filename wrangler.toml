name = "zero-nav"
account_id = "YOUR_ACCOUNT_ID"
main = "src/index.ts"
compatibility_date = "2026-01-15"

[[kv_namespaces]]
binding = "BOOKMARKS_KV"
id = "YOUR_KV_NAMESPACE_ID"

[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.client.js"]
fallthrough = true

[env.production]
name = "zero-nav"
main = "src/index.ts"
compatibility_date = "2026-01-15"
account_id = "YOUR_ACCOUNT_ID"

[[env.production.kv_namespaces]]
binding = "BOOKMARKS_KV"
id = "YOUR_KV_NAMESPACE_ID"

[[env.production.rules]]
type = "Text"
globs = ["**/*.css", "**/*.client.js"]
fallthrough = true
